<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Neon Sprint — Car Racing</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #101820;
      color: #f5f7f8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(ellipse at 50% 10%, rgba(31, 84, 91, .38), transparent 48%),
        #101820;
    }

    .game-shell {
      width: min(100%, 460px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #45e0c1;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.65rem, 7vw, 2.35rem);
      letter-spacing: .07em;
      line-height: 1;
    }

    .game-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 18px;
      background: #18252b;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .48), 0 0 32px rgba(69, 224, 193, .08);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      touch-action: none;
    }

    .hud {
      position: absolute;
      z-index: 1;
      top: 14px;
      right: 14px;
      left: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .hud-card {
      min-width: 90px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      background: rgba(10, 17, 21, .72);
      text-align: left;
      backdrop-filter: blur(6px);
    }

    .hud-label {
      display: block;
      margin-bottom: 2px;
      color: #9aadb2;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .hud-value {
      color: #fff;
      font-size: 1.12rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: linear-gradient(180deg, rgba(8, 15, 19, .32), rgba(8, 15, 19, .78));
    }

    .overlay[hidden] { display: none; }

    .panel {
      width: min(100%, 300px);
      padding: 27px 22px;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 16px;
      background: rgba(15, 25, 30, .91);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .25);
    }

    .panel h2 {
      margin: 0 0 9px;
      font-size: 1.65rem;
      letter-spacing: .04em;
    }

    .panel p {
      margin: 0 auto 18px;
      color: #bdc9cc;
      font-size: .92rem;
      line-height: 1.55;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: #45e0c1;
      color: #10201f;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    #start-button {
      width: 100%;
      min-height: 48px;
      letter-spacing: .08em;
    }

    .instructions {
      margin: 14px 0 0;
      color: #aab8bc;
      font-size: .82rem;
      line-height: 1.55;
    }

    .mobile-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 13px;
    }

    .mobile-controls button {
      width: 76px;
      height: 48px;
      background: #23353a;
      color: #eaf6f4;
      font-size: 1.35rem;
      touch-action: manipulation;
      user-select: none;
    }

    @media (min-width: 700px) and (pointer: fine) {
      .mobile-controls { display: none; }
    }

    @media (max-height: 760px) and (min-width: 700px) {
      body { padding: 12px; }
      canvas { max-height: calc(100vh - 105px); width: auto; margin: auto; }
      .game-frame { display: flex; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <p class="eyebrow">Arcade racing</p>
    <h1>NEON SPRINT</h1>
    <section class="game-frame" aria-label="Neon Sprint car racing game">
      <canvas id="game" width="480" height="720" aria-label="Road racing game. Use the left and right arrow keys to steer."></canvas>
      <div class="hud" aria-live="polite">
        <div class="hud-card">
          <span class="hud-label">DISTANCE</span>
          <span class="hud-value" id="score">00000</span>
        </div>
        <div class="hud-card">
          <span class="hud-label">BEST</span>
          <span class="hud-value" id="best">00000</span>
        </div>
      </div>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="panel-title">Ready, driver?</h2>
          <p id="panel-copy">Dodge the traffic, keep your wheels on the road, and see how far you can race.</p>
          <button id="start-button" type="button">START RACE</button>
          <p class="instructions">Steer with ← → or A / D<br>On mobile, use the buttons below</p>
        </div>
      </div>
    </section>
    <div class="mobile-controls" aria-label="Touch controls">
      <button type="button" id="left-button" aria-label="Steer left">←</button>
      <button type="button" id="right-button" aria-label="Steer right">→</button>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const scoreElement = document.querySelector("#score");
      const bestElement = document.querySelector("#best");
      const overlay = document.querySelector("#overlay");
      const panelTitle = document.querySelector("#panel-title");
      const panelCopy = document.querySelector("#panel-copy");
      const startButton = document.querySelector("#start-button");

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const road = { left: 58, right: 422, lanes: 3 };
      const laneWidth = (road.right - road.left) / road.lanes;
      const player = { lane: 1, x: 0, y: 570, width: 48, height: 82, color: "#45e0c1" };
      const trafficColors = ["#ff5f67", "#ffc857", "#7c83ff", "#f1f4f5", "#ff8b42"];
      const keys = new Set();
      let traffic = [];
      let particles = [];
      let running = false;
      let score = 0;
      let best = loadBest();
      let roadOffset = 0;
      let spawnTimer = 0;
      let lastTime = 0;
      let animationId = 0;
      let touchSteer = 0;

      bestElement.textContent = formatScore(best);
      player.x = laneCenter(player.lane);
      draw(0);

      function loadBest() {
        try {
          return Number.parseInt(localStorage.getItem("neon-sprint-best") || "0", 10) || 0;
        } catch (error) {
          console.warn("Could not read the saved best score.", error);
          return 0;
        }
      }

      function saveBest(value) {
        try {
          localStorage.setItem("neon-sprint-best", String(value));
        } catch (error) {
          console.warn("Could not save the best score.", error);
        }
      }

      function formatScore(value) {
        return String(Math.floor(value)).padStart(5, "0");
      }

      function laneCenter(lane) {
        return road.left + laneWidth * (lane + 0.5);
      }

      function startGame() {
        traffic = [];
        particles = [];
        score = 0;
        spawnTimer = 0.4;
        roadOffset = 0;
        player.lane = 1;
        player.x = laneCenter(player.lane);
        scoreElement.textContent = formatScore(score);
        overlay.hidden = true;
        running = true;
        lastTime = performance.now();
        cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(gameLoop);
      }

      function endGame() {
        running = false;
        const finalScore = Math.floor(score);
        if (finalScore > best) {
          best = finalScore;
          bestElement.textContent = formatScore(best);
          saveBest(best);
        }
        panelTitle.textContent = "Race over";
        panelCopy.textContent = `You covered ${formatScore(finalScore)} meters. Ready for another run?`;
        startButton.textContent = "RACE AGAIN";
        overlay.hidden = false;
      }

      function steer(direction) {
        if (!running) return;
        player.lane = Math.max(0, Math.min(road.lanes - 1, player.lane + direction));
      }

      function gameLoop(now) {
        if (!running) return;
        const delta = Math.min((now - lastTime) / 1000, 0.04);
        lastTime = now;
        update(delta);
        draw(delta);
        if (running) animationId = requestAnimationFrame(gameLoop);
      }

      function update(delta) {
        const speed = 320 + Math.min(score * 0.22, 260);
        roadOffset = (roadOffset + speed * delta) % 92;
        score += speed * delta * 0.055;
        scoreElement.textContent = formatScore(score);

        if (touchSteer !== 0) {
          steer(touchSteer);
          touchSteer = 0;
        }
        player.x += (laneCenter(player.lane) - player.x) * Math.min(1, delta * 12);

        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnTraffic();
          spawnTimer = Math.max(0.48, 1.04 - score / 1900) + Math.random() * 0.3;
        }

        for (const car of traffic) car.y += (speed * car.speedFactor) * delta;
        traffic = traffic.filter(car => car.y < HEIGHT + 110);
        for (const particle of particles) {
          particle.x += particle.vx * delta;
          particle.y += particle.vy * delta;
          particle.life -= delta;
        }
        particles = particles.filter(particle => particle.life > 0);

        const playerBox = {
          left: player.x - player.width * 0.34,
          right: player.x + player.width * 0.34,
          top: player.y + 12,
          bottom: player.y + player.height - 8
        };
        for (const car of traffic) {
          const overlapsX = Math.abs(player.x - car.x) < (player.width + car.width) * 0.38;
          const overlapsY = playerBox.bottom > car.y + 12 && playerBox.top < car.y + car.height - 8;
          if (overlapsX && overlapsY) {
            makeCrashParticles();
            endGame();
            break;
          }
        }
      }

      function spawnTraffic() {
        const availableLanes = Array.from({ length: road.lanes }, (_, lane) => lane)
          .filter(lane => !traffic.some(car => car.lane === lane && car.y < 190));
        if (availableLanes.length === 0) return;
        const lane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
        traffic.push({
          lane,
          x: laneCenter(lane),
          y: -100,
          width: 48,
          height: 82,
          color: trafficColors[Math.floor(Math.random() * trafficColors.length)],
          speedFactor: 0.82 + Math.random() * 0.22
        });
      }

      function makeCrashParticles() {
        for (let i = 0; i < 22; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 50 + Math.random() * 230;
          particles.push({
            x: player.x,
            y: player.y + player.height / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.35 + Math.random() * 0.5,
            color: Math.random() > 0.5 ? "#45e0c1" : "#ffc857"
          });
        }
      }

      function draw(delta) {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        drawScenery();
        drawRoad(delta);
        for (const car of traffic) drawCar(car.x, car.y, car.width, car.height, car.color, false);
        if (running) drawCar(player.x, player.y, player.width, player.height, player.color, true);
        for (const particle of particles) {
          ctx.globalAlpha = Math.max(0, particle.life * 1.8);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawScenery() {
        ctx.fillStyle = "#183d35";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "#1e493e";
        for (let y = -70 + roadOffset; y < HEIGHT; y += 150) {
          drawTree(25, y + 25);
          drawTree(455, y + 92);
        }
        ctx.fillStyle = "#d9d0aa";
        ctx.fillRect(road.left - 7, 0, 7, HEIGHT);
        ctx.fillRect(road.right, 0, 7, HEIGHT);
        ctx.fillStyle = "#bd514f";
        for (let y = -34 + roadOffset; y < HEIGHT; y += 92) {
          ctx.fillRect(road.left - 7, y, 7, 42);
          ctx.fillRect(road.right, y, 7, 42);
        }
      }

      function drawTree(x, y) {
        ctx.fillStyle = "rgba(5, 20, 18, .23)";
        ctx.beginPath();
        ctx.ellipse(x, y + 16, 13, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#28705a";
        ctx.beginPath();
        ctx.arc(x, y, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#358368";
        ctx.beginPath();
        ctx.arc(x - 4, y - 4, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawRoad() {
        ctx.fillStyle = "#303b42";
        ctx.fillRect(road.left, 0, road.right - road.left, HEIGHT);
        ctx.fillStyle = "rgba(255, 255, 255, .025)";
        for (let y = -80 + roadOffset * 1.5; y < HEIGHT; y += 46) {
          ctx.fillRect(road.left + 8, y, road.right - road.left - 16, 1);
        }
        ctx.fillStyle = "rgba(255, 255, 255, .72)";
        for (let lane = 1; lane < road.lanes; lane++) {
          const x = road.left + laneWidth * lane - 2;
          for (let y = -92 + roadOffset; y < HEIGHT; y += 92) {
            ctx.fillRect(x, y, 4, 48);
          }
        }
      }

      function drawCar(x, y, width, height, color, isPlayer) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "rgba(0, 0, 0, .32)";
        roundedRect(-width / 2 + 3, 7, width, height, 12);
        ctx.fill();

        ctx.fillStyle = "#11191d";
        roundedRect(-width / 2 - 3, 13, 8, 19, 3);
        ctx.fill();
        roundedRect(width / 2 - 5, 13, 8, 19, 3);
        ctx.fill();
        roundedRect(-width / 2 - 3, height - 31, 8, 19, 3);
        ctx.fill();
        roundedRect(width / 2 - 5, height - 31, 8, 19, 3);
        ctx.fill();

        ctx.fillStyle = color;
        roundedRect(-width / 2, 0, width, height, 12);
        ctx.fill();
        ctx.fillStyle = isPlayer ? "#a8fff0" : "rgba(255, 255, 255, .25)";
        roundedRect(-width * .39, 10, width * .78, 7, 3);
        ctx.fill();

        ctx.fillStyle = "#1c3239";
        roundedRect(-width * .34, 21, width * .68, 19, 6);
        ctx.fill();
        ctx.fillStyle = "rgba(172, 230, 235, .75)";
        roundedRect(-width * .28, 23, width * .56, 6, 3);
        ctx.fill();
        ctx.fillStyle = "#243b42";
        roundedRect(-width * .34, height - 37, width * .68, 19, 6);
        ctx.fill();

        ctx.fillStyle = isPlayer ? "#fff3ba" : "#ff7676";
        roundedRect(-width * .36, isPlayer ? 4 : height - 10, 10, 5, 2);
        ctx.fill();
        roundedRect(width * .16, isPlayer ? 4 : height - 10, 10, 5, 2);
        ctx.fill();
        if (isPlayer) {
          ctx.shadowColor = "#45e0c1";
          ctx.shadowBlur = 18;
          ctx.strokeStyle = "rgba(69, 224, 193, .8)";
          ctx.lineWidth = 2;
          roundedRect(-width / 2, 0, width, height, 12);
          ctx.stroke();
        }
        ctx.restore();
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
      }

      document.addEventListener("keydown", event => {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", " "].includes(key)) event.preventDefault();
        if (key === " " && !running) startGame();
        if (!keys.has(key)) {
          if (key === "arrowleft" || key === "a") steer(-1);
          if (key === "arrowright" || key === "d") steer(1);
        }
        keys.add(key);
      });

      document.addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
      window.addEventListener("blur", () => keys.clear());
      startButton.addEventListener("click", startGame);
      document.querySelector("#left-button").addEventListener("pointerdown", event => {
        event.preventDefault();
        touchSteer = -1;
      });
      document.querySelector("#right-button").addEventListener("pointerdown", event => {
        event.preventDefault();
        touchSteer = 1;
      });
    })();
  </script>
</body>
</html>
